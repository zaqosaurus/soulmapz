<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE SOUL SURVEY — a topographic survey of the collective soul</title>
<meta name="description" content="One map, many strange datasets: where the remembered were born, where desire points, where the cloud touches ground, where the crashes happened, what we named the land, what we see in the sky, where the pain settles, what we buried. Toggle the layers. The terrain is us.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23070a10'/><path d='M16 6 L26 24 L6 24 Z' fill='none' stroke='%23e8b34b' stroke-width='2'/><circle cx='16' cy='18' r='2.4' fill='%23e8b34b'/></svg>">
<meta property="og:title" content="THE SOUL SURVEY">
<meta property="og:description" content="A topographic survey of the collective soul, conducted in objective data. Fifteen real datasets, one living map. Density becomes elevation; overlap becomes light.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{SITE}}">
<meta property="og:image" content="{{SITE}}og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{SITE}}og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>/*{{CSS}}*/</style>
</head>
<body>
<div id="stage">
  <canvas id="cvBase"></canvas>
  <canvas id="cvTerrain"></canvas>
  <canvas id="cvGlow"></canvas>
  <canvas id="cvLabel"></canvas>
</div>
<div id="vignette"></div>
<div id="tooltip"></div>

<header id="masthead">
  <div class="mh-title">
    <div class="overline" id="mhSheet"></div>
    <h1 id="mhTitle"></h1>
    <div class="tagline" id="mhTagline"></div>
  </div>
  <div class="mh-controls">
    <button id="indexBtn" aria-label="Search the survey (press slash)">⌕&nbsp;INDEX</button>
    <div class="scope-switch" role="tablist" aria-label="Map scope">
      <button id="scopeUS" class="on">CONTERMINOUS&nbsp;U.S.</button><button id="scopeWorld">THE&nbsp;WORLD</button>
    </div>
    <div class="mh-menu-wrap">
      <button id="readingsBtn">READINGS&nbsp;▾</button>
      <div id="readingsMenu"></div>
    </div>
    <div class="mh-menu-wrap">
      <button id="findingsBtn">FINDINGS&nbsp;▾</button>
      <div id="findingsMenu"></div>
    </div>
    <button id="locateBtn" title="Zoom to your location and compose your local reading">⌖&nbsp;LOCATE</button>
    <button id="exportBtn" title="Render this view as a poster PNG">⤓&nbsp;SHEET</button>
    <button id="shareBtn" title="Link or embed exactly this view — it opens on the same place on any screen">⤴&nbsp;SHARE</button>
    <button id="audioBtn" title="Opt-in: the survey sings; density under your viewport drives the mix">♪&nbsp;AUDIO</button>
    <button id="aboutBtn">ABOUT</button>
  </div>
</header>

<button id="railToggle">LAYERS</button>
<aside id="rail" aria-label="Survey layers"></aside>

<div id="eraBar"></div>

<footer id="marginalia">
  <div id="datum" class="marg"></div>
  <div id="statline" class="marg"></div>
  <div id="scalebar" class="marg"><div id="sbBar"></div><span id="sbLabel"></span></div>
</footer>

<div id="capCard"></div>
<div id="recCard" role="dialog" aria-label="Compose a citizen reading"></div>
<div id="toast"></div>
<div id="splitHandle"><div class="sh-line"></div><div class="sh-grip">⇆</div></div>

<section id="plate" aria-live="polite"><div id="plateInner"></div></section>
<div id="about" role="dialog" aria-label="About the survey"><div id="aboutInner"></div></div>
<div id="indexOverlay" role="dialog" aria-label="Search the survey">
  <div id="idxBox">
    <input id="idxInput" type="text" placeholder="Search the survey — a town, a person, a company, a buried site, a layer…" aria-label="Search query" autocomplete="off" spellcheck="false">
    <div id="idxResults"></div>
    <div id="idxHint">↑↓ select · ENTER go · ▤ field dossier on places · ESC close</div>
  </div>
</div>
<div id="dossier" role="dialog" aria-label="Field dossier"><div id="dossierInner"></div></div>
<div id="shareCard" role="dialog" aria-label="Share this view or reading"></div>
<div id="hero"></div>
<div id="neatline"></div>
<div id="errbox"></div>

<script>//{{VENDOR}}</script>
<script>//{{DATA}}</script>
<script>//{{APP}}</script>
</body>
</html>
